scenario:
  id: buffer_pressure
  name: "High-Traffic Buffer Pressure & Congestion"
  description: "Saturates constrained satellite buffers with rapid packet bursts, demonstrating priority eviction, queue backpressure, and drop accounting"
  seed: 42
  duration_seconds: 60
  tick_seconds: 1

network:
  satellites:
    - id: SAT-01
      position: { x: 100, y: 150 }
      buffer_capacity_bytes: 16384  # 16 KB (holds 4 x 4KB packets max)
      energy_percent: 100.0
    - id: SAT-02
      position: { x: 250, y: 100 }
      buffer_capacity_bytes: 16384  # 16 KB
      energy_percent: 100.0
    - id: SAT-03
      position: { x: 250, y: 200 }
      buffer_capacity_bytes: 16384  # 16 KB
      energy_percent: 100.0
    - id: SAT-04
      position: { x: 400, y: 150 }
      buffer_capacity_bytes: 16384  # 16 KB
      energy_percent: 100.0
  ground_stations:
    - id: GROUND-01
      position: { x: 550, y: 150 }
  default_buffer_capacity_bytes: 16384

traffic:
  # Stream 1: High priority burst from SAT-01
  - source: SAT-01
    destination: GROUND-01
    packets_per_second: 2.0
    payload_size_bytes: 4096
    priority: high
    ttl_seconds: 60
    max_hops: 10
    start_time: 1.0
    stop_time: 15.0
    packet_count_limit: 15

  # Stream 2: Low priority background traffic from SAT-01 (should be evicted first under pressure)
  - source: SAT-01
    destination: GROUND-01
    packets_per_second: 2.0
    payload_size_bytes: 4096
    priority: low
    ttl_seconds: 30
    max_hops: 10
    start_time: 1.0
    stop_time: 15.0
    packet_count_limit: 15

routing:
  policy: swarmnet
  weights:
    progress: 0.30
    reliability: 0.20
    contact_feasibility: 0.20
    latency: 0.15
    congestion: 0.10
    energy: 0.05

links:
  # Inter-satellite link: SAT-01 to SAT-02
  - id: SAT-01-SAT-02
    source: SAT-01
    target: SAT-02
    latency_ms: 25
    bandwidth_mbps: 5
    reliability: 0.98
    symmetric: true
    schedule:
      - start: 0
        end: 60
        available: true

  # Inter-satellite link: SAT-01 to SAT-03
  - id: SAT-01-SAT-03
    source: SAT-01
    target: SAT-03
    latency_ms: 30
    bandwidth_mbps: 5
    reliability: 0.98
    symmetric: true
    schedule:
      - start: 0
        end: 60
        available: true

  # Relay to SAT-04
  - id: SAT-02-SAT-04
    source: SAT-02
    target: SAT-04
    latency_ms: 25
    bandwidth_mbps: 5
    reliability: 0.98
    symmetric: true
    schedule:
      - start: 0
        end: 60
        available: true

  - id: SAT-03-SAT-04
    source: SAT-03
    target: SAT-04
    latency_ms: 25
    bandwidth_mbps: 5
    reliability: 0.98
    symmetric: true
    schedule:
      - start: 0
        end: 60
        available: true

  # Downlink with intermittent contact window (causing buffer buildup during partition)
  - id: SAT-04-GROUND-01
    source: SAT-04
    target: GROUND-01
    latency_ms: 40
    bandwidth_mbps: 10
    reliability: 0.99
    symmetric: true
    schedule:
      - start: 0
        end: 10
        available: true
      - start: 10
        end: 25
        available: false  # Partition triggers buffer pressure and eviction
      - start: 25
        end: 60
        available: true
