scenario:
  id: intermittent_contact
  name: "Intermittent Contact & Store-Carry-Forward"
  description: "Temporary partition causes packets to buffer at satellite until ground contact returns"
  seed: 42
  duration_seconds: 60
  tick_seconds: 1

network:
  satellites:
    - id: SAT-01
      position: { x: 100, y: 150 }
      buffer_capacity_bytes: 1048576
      energy_percent: 100.0
    - id: SAT-02
      position: { x: 300, y: 150 }
      buffer_capacity_bytes: 1048576
      energy_percent: 100.0
  ground_stations:
    - id: GROUND-01
      position: { x: 500, y: 150 }
  default_buffer_capacity_bytes: 1048576

traffic:
  - source: SAT-01
    destination: GROUND-01
    packets_per_second: 1.0
    payload_size_bytes: 4096
    priority: normal
    ttl_seconds: 120
    max_hops: 10
    start_time: 12.0
    stop_time: 16.0
    packet_count_limit: 4

routing:
  policy: swarmnet
  weights:
    progress: 0.30
    reliability: 0.20
    contact_feasibility: 0.20
    latency: 0.15
    congestion: 0.10
    energy: 0.05

links:
  # Inter-satellite link remains connected
  - id: SAT-01-SAT-02
    source: SAT-01
    target: SAT-02
    latency_ms: 25
    bandwidth_mbps: 10
    reliability: 1.0
    symmetric: true
    schedule:
      - start: 0
        end: 60
        available: true

  # Space-to-ground link disconnected between t=10 and t=35
  - id: SAT-02-GROUND-01
    source: SAT-02
    target: GROUND-01
    latency_ms: 40
    bandwidth_mbps: 10
    reliability: 0.98
    symmetric: true
    schedule:
      - start: 0
        end: 10
        available: true
      - start: 10
        end: 35
        available: false
      - start: 35
        end: 60
        available: true
