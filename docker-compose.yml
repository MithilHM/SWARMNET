services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swarmnet-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./scenarios:/app/scenarios:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - swarmnet-net

  sat-01:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swarmnet-sat-01
    command: ["python", "-m", "uvicorn", "app.agents.agent_service:agent_app", "--host", "0.0.0.0", "--port", "8101"]
    ports:
      - "8101:8101"
    environment:
      - NODE_ID=SAT-01
      - NODE_TYPE=satellite
      - PORT=8101
      - BACKEND_URL=http://backend:8000
      - BUFFER_CAPACITY_BYTES=1048576
      - PYTHONUNBUFFERED=1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - swarmnet-net

